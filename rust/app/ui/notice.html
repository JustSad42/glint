<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Glint notice</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; }
    body { padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; height: 100vh; box-sizing: border-box; }
    .card {
      position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 14px 14px 12px 16px; border-radius: 12px;
      background: var(--bg-solid); border: 1px solid var(--line-2); box-shadow: 0 8px 28px rgba(0,0,0,.35);
      animation: slide .22s var(--ease); overflow: hidden; height: 96px; box-sizing: border-box;
    }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
    .card.err::before { background: var(--danger); }
    .card.ok::before { background: var(--ok); }
    @keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--accent); background: color-mix(in oklab, var(--accent) 15%, transparent); }
    .card.timer .ic { animation: ring 1s ease-in-out 3; }
    @keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
    .card.err .ic { color: var(--danger); background: color-mix(in oklab, var(--danger) 15%, transparent); }
    .card.ok .ic { color: var(--ok); background: color-mix(in oklab, var(--ok) 15%, transparent); }
    .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .t1 { font: 600 14px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t2 { font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; user-select: text; }
    .btns { display: flex; gap: 6px; margin-top: 6px; }
    button { height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font: 500 12px var(--font); cursor: pointer; }
    button:hover { background: var(--hover); }
    button.primary { background: var(--accent); border-color: transparent; color: #fff; }
    .x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-3); }
    .x:hover { color: var(--text); }
  </style>
</head>
<body>
  <script src="glyphs.js"></script>
  <script>
    let list = [];
    function render() {
      document.body.innerHTML = list.map((n) => `
        <div class="card ${esc(n.kind || '')}" data-id="${n.id}">
          <div class="ic">${glyph(n.kind === 'timer' ? 'bell' : n.kind === 'err' ? 'warn' : n.kind === 'ok' ? 'check' : 'glint', 20)}</div>
          <div class="txt"><div class="t1">${esc(n.title)}</div><div class="t2">${esc(n.body || '')}</div>
            <div class="btns">${n.kind === 'timer' ? '<button class="primary" data-a="ok">Done</button><button data-a="s5">Snooze 5 min</button><button data-a="s15">15 min</button>' : '<button data-a="ok">OK</button>'}</div>
          </div>
          <button class="x" data-a="ok" title="Dismiss">${glyph('x', 13)}</button>
        </div>`).join('');
      document.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => {
        const id = +b.closest('.card').dataset.id;
        const a = b.dataset.a;
        if (a === 'ok') call('notice_dismiss', { id });
        else call('notice_snooze', { id, mins: a === 's5' ? 5 : 15 });
      }));
    }
    listen('notices', (l) => { list = l || []; render(); });
    listen('settings-changed', (s) => applyTheme(s));
    call('settings_get').then(applyTheme);
    call('notices').then((l) => { list = l || []; render(); });
    // script results go away on their own; timers wait for you
    setInterval(() => {
      const now = Date.now();
      for (const n of list) {
        if (n.kind !== 'timer' && now - n.id > 9000) call('notice_dismiss', { id: n.id });
      }
    }, 1000);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => call('settings_get').then(applyTheme));
  </script>
</body>
</html>
