[package]
name = "glint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast launcher and search for Windows"

[[bin]]
name = "glint"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
glint-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow"] }
egui = "0.37"
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
tray-icon = "0.25"
global-hotkey = "0.8"
raw-window-handle = "0.6"
windows-core = "0.61"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
png = "0.17"
tantivy = "0.24"
notify = "8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
ureq = { version = "3", features = ["json"] }
app-update = { git = "https://github.com/JustSad42/app-update", tag = "v1.0.0" }
winreg = "0.55"
clipboard-win = "5"
urlencoding = "2"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_DataExchange",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Foundation",
    "Foundation_Collections",
    "Devices_Radios",
    "Media_Control",
    "Storage_Streams",
    "Win32_UI_Accessibility",
    "Win32_Devices_FunctionDiscovery",
]
