[package]
name = "glint-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Glint's background service: keeps every file name on your NTFS drives in memory"

[[bin]]
name = "glint-indexer"
path = "src/main.rs"

[dependencies]
glint-core = { path = "../core" }
serde_json = "1"
parking_lot = "0.12"
windows-service = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
